<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruvatek – Hesap Aktivasyonu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0a1628 0%, #0d2444 50%, #0a1628 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            background: rgba(13,31,60,0.8);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo h1 { color: #e8f4fd; font-size: 24px; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px; }
        .logo h1 span { color: #3b82f6; }
        .icon { font-size: 64px; margin: 24px 0; }
        h2 { color: #e8f4fd; font-size: 20px; margin-bottom: 12px; }
        p { color: #4a7fa8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #60a5fa; }
        .error { color: #fca5a5; font-size: 13px; margin-top: 16px; }
        .success { color: #4ade80; font-size: 13px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>PRUVA<span>TEK</span></h1>
        </div>
        <div class="icon" id="icon">⏳</div>
        <h2 id="title">Hesabınız Aktive Ediliyor...</h2>
        <p id="message">Lütfen bekleyin.</p>
        <div id="action"></div>
    </div>

    <script>
        async function activate() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                document.getElementById('icon').textContent = '❌';
                document.getElementById('title').textContent = 'Geçersiz Link';
                document.getElementById('message').textContent = 'Aktivasyon linki geçersiz.';
                return;
            }

            try {
                const response = await fetch('https://pruvatek-api.pruvatek.workers.dev/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('icon').textContent = '✅';
                    document.getElementById('title').textContent = 'Hesabınız Aktive Edildi!';
                    document.getElementById('message').textContent = 'Artık Pruvatek panelinize giriş yapabilirsiniz.';
                    document.getElementById('action').innerHTML = '<a href="/giris.html" class="btn">Giriş Yap</a>';
                } else {
                    document.getElementById('icon').textContent = '❌';
                    document.getElementById('title').textContent = 'Aktivasyon Başarısız';
                    document.getElementById('message').textContent = data.error || 'Bir hata oluştu.';
                }
            } catch (err) {
                document.getElementById('icon').textContent = '❌';
                document.getElementById('title').textContent = 'Bağlantı Hatası';
                document.getElementById('message').textContent = 'Lütfen tekrar deneyin.';
            }
        }

        activate();
    </script>
</body>
</html>
