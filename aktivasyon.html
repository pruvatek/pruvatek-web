<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruvatek – Hesap Aktivasyonu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0a1628 0%, #0d2444 50%, #0a1628 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            background: rgba(13,31,60,0.8);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo h1 { color: #e8f4fd; font-size: 24px; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px; }
        .logo h1 span { color: #3b82f6; }
        .icon { font-size: 64px; margin: 24px 0; }
        h2 { color: #e8f4fd; font-size: 20px; margin-bottom: 12px; }
        p { color: #4a7fa8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; color: #4a7fa8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input {
            width: 100%;
            background: rgba(7,20,40,0.6);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: #e8f4fd;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: rgba(59,130,246,0.6); }
        .btn {
            width: 100%;
            background: #3b82f6;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover { background: #60a5fa; }
        .btn:disabled { background: #1e3a5f; cursor: not-allowed; }
        .error { color: #fca5a5; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>PRUVA<span>TEK</span></h1>
        </div>
        <div class="icon">🔐</div>
        <h2>Şifrenizi Belirleyin</h2>
        <p>Pruvatek panelinize erişmek için bir şifre belirleyin.</p>

        <div id="form-section">
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" placeholder="En az 8 karakter" />
            </div>
            <div class="form-group">
                <label>Şifre Tekrar</label>
                <input type="password" id="password2" placeholder="Şifrenizi tekrar girin" />
            </div>
            <button class="btn" id="btn" onclick="activate()">Hesabımı Aktive Et</button>
            <div class="error" id="error"></div>
        </div>

        <div id="success-section" style="display:none;">
            <div style="font-size:48px; margin-bottom:16px;">✅</div>
            <h2>Hesabınız Aktive Edildi!</h2>
            <p>Artık Pruvatek panelinize giriş yapabilirsiniz.</p>
            <a href="/giris.html" class="btn" style="display:block; text-decoration:none; margin-top:16px;">Giriş Yap</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.querySelector('.icon').textContent = '❌';
            document.querySelector('h2').textContent = 'Geçersiz Link';
            document.querySelector('p').textContent = 'Aktivasyon linki geçersiz.';
            document.getElementById('form-section').style.display = 'none';
        }

        async function activate() {
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const btn = document.getElementById('btn');
            const errorDiv = document.getElementById('error');

            errorDiv.style.display = 'none';

            if (password.length < 8) {
                errorDiv.textContent = 'Şifre en az 8 karakter olmalı';
                errorDiv.style.display = 'block';
                return;
            }

            if (password !== password2) {
                errorDiv.textContent = 'Şifreler eşleşmiyor';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Aktive ediliyor...';

            try {
                const response = await fetch('https://pruvatek-api.pruvatek.workers.dev/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('form-section').style.display = 'none';
                    document.getElementById('success-section').style.display = 'block';
                } else {
                    errorDiv.textContent = data.error || 'Bir hata oluştu';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Hesabımı Aktive Et';
                }
            } catch (err) {
                errorDiv.textContent = 'Bağlantı hatası';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Hesabımı Aktive Et';
            }
        }
    </script>
</body>
</html>
