<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruvatek – Giriş</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0a1628 0%, #0d2444 50%, #0a1628 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            background: rgba(13,31,60,0.8);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { color: #e8f4fd; font-size: 24px; font-weight: 700; letter-spacing: 3px; }
        .logo h1 span { color: #3b82f6; }
        .logo p { color: #4a7fa8; font-size: 13px; margin-top: 6px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #4a7fa8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input {
            width: 100%;
            background: rgba(7,20,40,0.6);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: #e8f4fd;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: rgba(59,130,246,0.6); }
        button {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button:hover { background: #60a5fa; }
        button:disabled { background: #1e3a5f; cursor: not-allowed; }
        .error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            padding: 12px;
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .back { text-align: center; margin-top: 24px; }
        .back a { color: #4a7fa8; font-size: 13px; text-decoration: none; }
        .back a:hover { color: #e8f4fd; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div style="font-size:32px; margin-bottom:12px;">⚓</div>
            <h1>PRUVA<span>TEK</span></h1>
            <p>Tekne Kontrol Sistemi</p>
        </div>
        <div class="error" id="error"></div>
        <div class="form-group">
            <label>E-posta</label>
            <input type="email" id="email" placeholder="ornek@email.com" />
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>
        <button id="loginBtn" onclick="login()">Giriş Yap</button>
        <div class="back">
            <a href="/">← Ana Sayfaya Dön</a>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('error');

            errorDiv.style.display = 'none';

            if (!email || !password) {
                errorDiv.textContent = 'Email ve şifre gerekli';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Giriş yapılıyor...';

            try {
                // Pruvatek API'ye login
                const response = await fetch('https://pruvatek-api.pruvatek.workers.dev/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Cookie kaydet
                    document.cookie = `pruvatek_token=${data.token}; path=/; domain=.pruvatek.com; max-age=${7*24*60*60}; secure; samesite=strict`;
                    
                    const haUrl = `https://${data.subdomain}.pruvatek.com`;

                    // HA'ya otomatik login ol
                    try {
                        const loginFlow = await fetch(`${haUrl}/auth/login_flow`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                client_id: haUrl + '/', 
                                handler: ['homeassistant', null], 
                                redirect_uri: haUrl + '/?auth_callback=1'
                            })
                        });
                        const flowData = await loginFlow.json();

                        const loginResult = await fetch(`${haUrl}/auth/login_flow/${flowData.flow_id}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                client_id: haUrl + '/',
                                username: 'pruvatek', 
                                password: 'Pr@v4tek#2026$Boat!' 
                            })
                        });
                        const loginData = await loginResult.json();

                        if (loginData.type === 'create_session') {
                            window.location.href = `${haUrl}/?auth_callback=1&code=${loginData.result}`;
                        } else {
                            window.location.href = haUrl;
                        }
                    } catch (haErr) {
                        window.location.href = haUrl;
                    }

                } else {
                    errorDiv.textContent = data.error || 'Giriş başarısız';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Giriş Yap';
                }
            } catch (err) {
                errorDiv.textContent = 'Bağlantı hatası. Lütfen tekrar deneyin.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Giriş Yap';
            }
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
